plugins {
    id 'java'
    id 'application'
}

group = 'com.textrpg'
version = '0.1.0'

// 외부 라이브러리 없이 순수 Java만 사용한다. dependencies 블록에 아무것도 추가하지 않는다.

java {
    // JDK 17 이상이면 어떤 버전으로 빌드해도 Java 17 문법/API로 컴파일된다.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:all', '-Xlint:-serial']
}

application {
    mainClass = 'com.textrpg.Main'
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8']
}

// ./gradlew run 에서 키보드 입력(Scanner)을 받을 수 있게 표준 입력을 연결한다.
tasks.named('run') {
    standardInput = System.in
}

// 실행 가능한 jar: java -jar build/libs/into-the-dark-0.1.0.jar
tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'com.textrpg.Main'
    }
}

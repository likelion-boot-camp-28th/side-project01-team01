plugins {
    id 'java'
    id 'application'
}

group = 'com.textrpg'
version = '0.1.0'

// 외부 라이브러리 없이 순수 Java만 사용한다. dependencies 블록에 아무것도 추가하지 않는다.

java {
    // JDK 17 이상이면 어떤 버전으로 빌드해도 Java 17 문법/API로 컴파일된다.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:all', '-Xlint:-serial']
}

application {
    mainClass = 'com.textrpg.Main'
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8']
}

// JUnit 을 쓰지 않으므로 기본 test 태스크는 끄고, src/test/java 의 확인용 main 클래스를 실행한다 (Team_Rules 2.11).
// 확인용 클래스를 새로 만들면 아래 목록에 추가한다. 하나라도 실패(종료 코드 1)하면 build 가 실패한다.
def checkClasses = [
        'com.textrpg.core.MessageLogCheck',
        'com.textrpg.game.CommandParserCheck',
        'com.textrpg.item.ItemFactoryCheck',
        'com.textrpg.map.DungeonGeneratorCheck',
        'com.textrpg.save.SaveFileParserCheck',
        'com.textrpg.save.SaveFileWriterCheck',
        'com.textrpg.save.SaveManagerCheck',
        'com.textrpg.ui.MapRendererCheck',
]

tasks.named('test') {
    enabled = false
}

def runChecks = tasks.register('runChecks') {
    group = 'verification'
    description = 'src/test/java 의 확인용 main 클래스를 모두 실행한다.'
}

checkClasses.each { className ->
    def checkTask = tasks.register('run' + className.tokenize('.').last(), JavaExec) {
        group = 'verification'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
    }
    runChecks.configure { dependsOn checkTask }
}

tasks.named('check') {
    dependsOn runChecks
}

// ./gradlew run 에서 키보드 입력(Scanner)을 받을 수 있게 표준 입력을 연결한다.
tasks.named('run') {
    standardInput = System.in
}

// 실행 가능한 jar: java -jar build/libs/into-the-dark-0.1.0.jar
tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'com.textrpg.Main'
    }
}
